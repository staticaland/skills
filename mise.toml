#:schema https://mise.jdx.dev/schema/mise.json

[settings]
# Record exact versions and checksums in mise.lock.
#
# The lockfile has to cover every platform the toolchain runs on, and a plain
# `mise install` records only the platform it ran on - a sync from a Mac drops
# the linux-x64 entries that `install_args: --locked` needs on the CI runner.
# Regenerate it with both platforms named:
#   mise lock --platform linux-x64,macos-arm64
lockfile = true
# Hold back releases published in the last 7 days.
minimum_release_age = "7d"

[tools]
"aqua:astral-sh/ruff" = "0.16.2"
"aqua:carvel-dev/vendir" = "0.46.0"
# Enforces .editorconfig. Nothing else in the bar reads that file, so without
# this the settings only reach editors, never a check. aqua installs the
# release asset under its per-platform name and symlinks `ec` beside it, so
# `ec` is the command, not `editorconfig-checker`.
"aqua:editorconfig-checker/editorconfig-checker" = "3.11.1"
"aqua:errata-ai/vale" = "3.17.1"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:lycheeverse/lychee" = "0.24.2"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:rvben/rumdl" = "0.2.54"
# Formats and lints TOML. prettier covers JSON, Markdown, and YAML but not
# TOML, which is what every config in this repo's root is written in.
"aqua:tombi-toml/tombi" = "1.3.3"
"aqua:zizmorcore/zizmor" = "1.29.0"
# Spell checker. Ships only as an npm package, which is why node is pinned
# below rather than left to whatever the machine has.
"npm:cspell" = "10.0.1"
"npm:prettier" = "3.9.6"
node = "24.19.0"
prek = "0.4.13"
