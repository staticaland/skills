# mise 2026.10.19 added `checksum_source` to mise.lock; an older mise drops it
# whenever it rewrites the lockfile.
min_version = "2026.10.19"

[settings]
# Record exact versions and checksums in mise.lock.
lockfile = true
# Hold back releases published in the last 7 days.
minimum_release_age = "7d"

[tools]
"aqua:astral-sh/ruff" = "0.17.5"
"aqua:carvel-dev/vendir" = "0.46.3"
"aqua:errata-ai/vale" = "3.27.0"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:lycheeverse/lychee" = "0.24.2"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:rvben/rumdl" = "0.3.4"
"aqua:zizmorcore/zizmor" = "1.32.0"
"npm:prettier" = "3.10.1"
node = "26.13.1"
prek = "0.5.10"
