# Install mise itself before running these hooks.
# prettier and markdownlint-cli2 skip the vendored skills through their own
# configuration. Vale has no path exclusion in `.vale.ini`, so its list sits
# here and in `.github/workflows/vale.yml`.
repos:
  - repo: local
    hooks:
      - id: mise-install
        name: mise trust and install locked tools
        entry: |
          export MISE_GLOBAL_CONFIG_FILE=/dev/null
          export MISE_SYSTEM_CONFIG_FILE=/dev/null
          export MISE_OVERRIDE_TOOL_VERSIONS_FILENAMES=none
          export MISE_CEILING_PATHS="$(dirname "$(git rev-parse --show-toplevel)")"
          mise trust mise.toml
          mise install --locked
        language: system
        shell: sh
        pass_filenames: false
        always_run: true
        fail_fast: true
        verbose: true
        priority: 0
        stages: [pre-commit, commit-msg]
      - id: prettier
        name: prettier
        entry: mise exec -- prettier --check
        language: system
        files: \.(json|md|ya?ml)$
      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: mise exec -- markdownlint-cli2
        language: system
        files: \.md$
      - id: claude-plugin-validate
        name: claude plugin validate
        entry: claude plugin validate .
        language: system
        pass_filenames: false
      - id: codex-manifest-lockstep
        name: codex manifest matches plugin.json
        entry: |
          set -e
          for codex in */.codex-plugin/plugin.json; do
            [ -e "$codex" ] || continue
            diff -u "${codex%.codex-plugin/plugin.json}.claude-plugin/plugin.json" "$codex"
          done
        language: system
        shell: sh
        pass_filenames: false

  - repo: https://github.com/vale-cli/vale
    rev: bc78bf3a639f29eef5c6bc3f0680105a82ef46f7 # frozen: v3.17.1
    hooks:
      - id: vale
        exclude: ^(ai/skills/writing-for-agents|dev/skills/(agent-browser|domain-modeling|gh-stack|grill-me|grill-with-docs|grilling)|other/skills/(bro|wait-what))/
      - id: vale
        name: vale (commit message)
        entry: scripts/vale-commit-message.sh
        stages: [commit-msg]
