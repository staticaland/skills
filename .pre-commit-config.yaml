# Use `mise trust` and `mise install` to install the required tools.
repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --check
        language: system
        files: \.(json|md|ya?ml)$
      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: markdownlint-cli2
        language: system
        files: \.md$
      - id: claude-plugin-validate
        name: claude plugin validate
        entry: claude plugin validate .
        language: system
        pass_filenames: false

  - repo: https://github.com/vale-cli/vale
    rev: fe71481c95665a2343d81874489f8b012442a377 # frozen: v3.17.0
    hooks:
      - id: vale
      - id: vale
        name: vale (commit message)
        entry: scripts/vale-commit-message.sh
        stages: [commit-msg]
