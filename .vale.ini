StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.31.0/ai-tells.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.31.0/ai-tells-commits.zip
Vocab = Skills

[formats]
COMMIT_EDITMSG = md

[*.md]
BasedOnStyles = Vale, Skills, ai-tells

[{COMMIT_EDITMSG,.git/COMMIT_EDITMSG,**/COMMIT_EDITMSG}]
BasedOnStyles = ai-tells, ai-tells-commits

# Skills vendored by vendir - see `.prettierignore` for the full list and the
# reason. An empty BasedOnStyles turns every style off for these paths.
[{plugins/retro/skills/retro,plugins/skill-authoring/skills/writing-for-agents,plugins/browser/skills/agent-browser,plugins/grilling/skills/domain-modeling,plugins/pull-requests/skills/gh-stack,plugins/grilling/skills/grill-me,plugins/grilling/skills/grill-with-docs,plugins/grilling/skills/grilling,plugins/toolchain/skills/prek,plugins/plain-language/skills/bro,plugins/plain-language/skills/wait-what,plugins/prose/skills/unslop,plugins/show-me/skills/show-me}/**]
BasedOnStyles =

# The local installs of the vendored `writing-for-agents` skill: the same
# upstream prose as `plugins/skill-authoring/skills/writing-for-agents`, only rewrapped, so they are
# turned off here for the same reason.
[{.claude,.agents}/skills/writing-for-agents/**]
BasedOnStyles =

# The ai-tells rules read English: the figurative-verb tokens are English
# words, and the part-of-speech rules run an English tagger, which tags
# Norwegian as noun after noun. Neither says anything true about this skill.
[plugins/norsk/skills/kontrollert-norsk/**]
BasedOnStyles = Vale, Skills

# Per-plugin changelogs that release-please generates - bot output, not
# hand-written prose.
[plugins/*/CHANGELOG.md]
BasedOnStyles =
