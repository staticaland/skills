StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.29.0/ai-tells.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.29.0/ai-tells-commits.zip
Vocab = Skills

[formats]
COMMIT_EDITMSG = md

[*.md]
BasedOnStyles = Vale, Skills, ai-tells

[{COMMIT_EDITMSG,.git/COMMIT_EDITMSG,**/COMMIT_EDITMSG}]
BasedOnStyles = ai-tells, ai-tells-commits

# Skills vendored by vendir - see `.prettierignore` for the full list and the
# reason. An empty BasedOnStyles turns every style off for these paths.
[{ai/skills/writing-for-agents,dev/skills/agent-browser,dev/skills/domain-modeling,dev/skills/gh-stack,dev/skills/grill-me,dev/skills/grill-with-docs,dev/skills/grilling,dev/skills/prek,other/skills/bro,other/skills/wait-what}/**]
BasedOnStyles =

# Per-plugin changelogs that release-please generates - bot output, not
# hand-written prose.
[*/CHANGELOG.md]
BasedOnStyles =
