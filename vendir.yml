# Adding a skill here takes six more edits. Every check in the repository
# reads one of these lists, and a check that still sees a vendored path
# reformats files that the next `vendir sync` overwrites:
#
#   1. `.prettierignore`
#   2. `exclude` in `.rumdl.toml`
#   3. the empty-styles section in `.vale.ini`
#   4. `exclude_path` in `lychee.toml`
#   5. `Exclude` in `.editorconfig-checker.json`
#   6. `ignorePaths` in `.cspell.jsonc`
#
# Two more rules for a new entry:
#
# - `ignorePaths` keeps `UPSTREAM.md` (and `LICENSE`, where upstream ships one)
#   through a sync. Without it, the sync deletes the attribution.
# - Name the upstream commit here and nowhere else. A SHA repeated in an
#   `UPSTREAM.md` goes stale the next time a `ref` moves.
#
# A sync rewrites `vendir.lock.yml` unformatted, so run
# `mise exec -- prettier --write vendir.lock.yml` before you commit it.
apiVersion: vendir.k14s.io/v1alpha1
kind: Config
directories:
  - path: other/skills/bro
    contents:
      - path: .
        git:
          url: https://github.com/dmmulroy/.dotfiles
          ref: cdba491f1f9c952979af37f15e4c3efb26f625df
        includePaths:
          - home/.agents/skills/bro/**/*
        ignorePaths:
          - UPSTREAM.md
        newRootPath: home/.agents/skills/bro
  - path: ai/skills/writing-for-agents
    contents:
      - path: .
        git:
          url: https://github.com/mattpocock/skills
          ref: 84fdeffd12f2ee307994d1eb6feb48173b6e0502
        includePaths:
          - skills/productivity/writing-for-agents/**/*
        ignorePaths:
          - LICENSE
          - UPSTREAM.md
        newRootPath: skills/productivity/writing-for-agents
  - path: dev/skills/agent-browser
    contents:
      - path: .
        git:
          url: https://github.com/vercel-labs/agent-browser
          ref: 548b159b30eef119ccf6846c8bc807d0eaa3f6f8
