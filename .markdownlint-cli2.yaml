# Skills vendored by vendir - see `.prettierignore` for the full list and the
# reason.
ignores:
  - "ai/skills/writing-for-agents/**"
  - "dev/skills/agent-browser/**"
  - "dev/skills/domain-modeling/**"
  - "dev/skills/gh-stack/**"
  - "dev/skills/grill-me/**"
  - "dev/skills/grill-with-docs/**"
  - "dev/skills/grilling/**"
  - "dev/skills/prek/**"
  - "other/skills/bro/**"
  - "other/skills/wait-what/**"
  # Per-plugin changelogs that release-please generates - bot output, not
  # hand-written prose.
  - "*/CHANGELOG.md"

config:
  MD010:
    code_blocks: false
  MD013:
    line_length: 80
    code_blocks: false
    tables: false
  MD024:
    siblings_only: true
