name: Prek
on:
  push:
    branches: [main]
  pull_request:

# A second push to a branch makes the first run's result irrelevant. Cancel it
# on pull requests; let main runs finish so every commit keeps a status.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prek:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # renovate: datasource=github-releases depName=jdx/mise
      MISE_VERSION: "2026.10.18"
      # renovate: datasource=github-releases depName=j178/prek
      PREK_VERSION: "0.5.7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: --locked
      - name: Register problem matchers
        run: |
          for matcher in .github/problem-matchers/*.json; do
            echo "::add-matcher::$matcher"
          done
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          prek-version: ${{ env.PREK_VERSION }}
        env:
          # The claude CLI is not installed on the runner.
          PREK_SKIP: claude-plugin-validate
