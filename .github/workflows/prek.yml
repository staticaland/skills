name: Prek
on:
  push:
    branches: [main]
  pull_request:

# A second push to a branch makes the first run's result irrelevant. Cancel it
# on pull requests; let main runs finish so every commit keeps a status.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prek:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # renovate: datasource=github-releases depName=jdx/mise
      MISE_VERSION: "2026.9.5"
      # renovate: datasource=github-releases depName=j178/prek
      PREK_VERSION: "0.5.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: --locked
      - name: Register problem matchers
        run: |
          for matcher in .github/problem-matchers/*.json; do
            echo "::add-matcher::$matcher"
          done
      - uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with:
          prek-version: ${{ env.PREK_VERSION }}
        env:
          # The claude CLI is not installed on the runner.
          PREK_SKIP: claude-plugin-validate
