name: Prek
on:
  push:
    branches: [main]
  pull_request:

# A second push to a branch makes the first run's result irrelevant. Cancel it
# on pull requests; let main runs finish so every commit keeps a status.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prek:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # renovate: datasource=github-releases depName=jdx/mise
      MISE_VERSION: "2026.10.20"
      # renovate: datasource=github-releases depName=j178/prek
      PREK_VERSION: "0.5.6"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request checks out its merge commit; the first parent is
          # the base branch, which the Vale step below diffs against.
          fetch-depth: 2
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: --locked
      - name: Register problem matchers
        run: |
          for matcher in .github/problem-matchers/*.json; do
            echo "::add-matcher::$matcher"
          done
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          prek-version: ${{ env.PREK_VERSION }}
        env:
          # The claude CLI is not installed on the runner. On a pull request,
          # Vale runs in the next step instead.
          PREK_SKIP: ${{ github.event_name == 'pull_request' && 'claude-plugin-validate,vale' || 'claude-plugin-validate' }}
      # A pull request lints only the prose it changes, so a Vale or style
      # upgrade that flags existing prose does not block the upgrade itself.
      # Pushes to main still lint every file and surface those alerts.
      - name: Vale on changed files
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: mise exec -- prek run vale --show-diff-on-failure --color=always --from-ref HEAD^1 --to-ref HEAD
