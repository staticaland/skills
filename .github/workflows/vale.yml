name: Vale
on:
  push:
    paths:
      - "**.md"
      - ".vale.ini"
      - ".vale/**"
      - ".github/workflows/vale.yml"
  pull_request:
    paths:
      - "**.md"
      - ".vale.ini"
      - ".vale/**"
      - ".github/workflows/vale.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: errata-ai/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          files: .
          reporter: github-pr-check
          # Skills vendored by vendir - see .prettierignore for the reason.
          glob: "!{ai/skills/writing-for-agents,dev/skills/agent-browser,dev/skills/domain-modeling,dev/skills/grill-me,dev/skills/grill-with-docs,dev/skills/grilling,other/skills/bro,other/skills/wait-what}/**"
