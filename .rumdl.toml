# Configuration file for `rumdl`, a markdown linter written in Rust.
# See https://github.com/rvben/rumdl for more information.
#:tombi schema.strict = false
# Strict mode off: rumdl's schemastore entry omits `respect_gitignore`, which
# rumdl itself supports, so tombi would flag a valid key.

[global]
disable = [
  "MD013",  # Line length
  "MD033",  # Inline HTML
]
respect_gitignore = true
exclude = [
  ".git",
  ".vale",
  "tmp",
  # Skills vendored by vendir. Upstream writes these files, so this repository
  # does not lint them. The same list lives in `.prettierignore` and in the
  # empty-styles section in `.vale.ini`.
  "plugins/retro/skills/retro",
  "plugins/skill-authoring/skills/writing-for-agents",
  "plugins/browser/skills/agent-browser",
  "plugins/grilling/skills/domain-modeling",
  "plugins/pull-requests/skills/gh-stack",
  "plugins/grilling/skills/grill-me",
  "plugins/grilling/skills/grill-with-docs",
  "plugins/grilling/skills/grilling",
  "plugins/toolchain/skills/prek",
  "plugins/plain-language/skills/bro",
  "plugins/plain-language/skills/wait-what",
  "plugins/prose/skills/unslop",
  "plugins/show-me/skills/show-me",
  # Per-plugin changelogs that release-please generates - bot output, not
  # hand-written prose.
  "plugins/*/CHANGELOG.md",
]

# The pull request template opens at level 2: GitHub renders the pull
# request title above the body, so a level 1 heading inside the template
# would repeat it.
[per-file-ignores]
".github/PULL_REQUEST_TEMPLATE.md" = ["MD041"]
"plugins/pull-requests/skills/create-pr/references/pr-template.md" = ["MD041"]

[MD003]
style = "atx"

[MD004]
style = "dash"

[MD025]
front_matter_title = ""

[MD046]
style = "fenced"

[MD048]
style = "backtick"
