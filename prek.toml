# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

# Install mise itself before running these hooks.
# prettier, rumdl, and Vale all skip the vendored skills through their own
# configuration.

[[repos]]
repo = "local"
hooks = [
  {
    id = "mise-install",
    name = "mise trust and install locked tools",
    entry = """
export MISE_GLOBAL_CONFIG_FILE=/dev/null
export MISE_SYSTEM_CONFIG_FILE=/dev/null
export MISE_OVERRIDE_TOOL_VERSIONS_FILENAMES=none
export MISE_CEILING_PATHS="$(dirname "$(git rev-parse --show-toplevel)")"
mise trust mise.toml
mise install --locked
""",
    language = "system",
    shell = "sh",
    pass_filenames = false,
    always_run = true,
    fail_fast = true,
    verbose = true,
    priority = 0,
    stages = [
      "pre-commit",
      "commit-msg"
    ]
  },
  {
    id = "prettier",
    name = "prettier",
    entry = "mise exec -- prettier --check",
    language = "system",
    files = '\.(json|md|ya?ml)$'
  },
  {
    id = "rumdl",
    name = "rumdl",
    entry = "mise exec -- rumdl check",
    language = "system",
    files = '\.md$'
  },
  {
    id = "claude-plugin-validate",
    name = "claude plugin validate",
    entry = "claude plugin validate .",
    language = "system",
    pass_filenames = false
  },
  {
    id = "sync-manifests",
    name = "derived manifests match plugin.json",
    entry = "python3 scripts/sync-manifests.py --check",
    language = "system",
    pass_filenames = false
  },
  {
    id = "actionlint",
    name = "actionlint",
    entry = "mise exec -- actionlint",
    language = "system",
    files = '^\.github/workflows/[^/]+\.ya?ml$'
  },
  {
    id = "zizmor",
    name = "zizmor",
    entry = "mise exec -- zizmor",
    language = "system",
    files = '^\.github/workflows/[^/]+\.ya?ml$'
  },
  {
    id = "vale",
    name = "vale",
    entry = "mise exec -- scripts/vale-with-guidance.sh",
    language = "system",
    files = '\.md$',
    verbose = true
  },
  {
    id = "vale-commit-message",
    name = "vale (commit message)",
    entry = "mise exec -- scripts/vale-commit-message.sh",
    language = "system",
    stages = ["commit-msg"]
  }
]
