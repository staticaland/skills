# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

# Install mise itself before running these hooks.
# prettier, markdownlint-cli2, and Vale all skip the vendored skills through
# their own configuration.

[[repos]]
repo = "local"
hooks = [
  {
    id = "mise-install",
    name = "mise trust and install locked tools",
    entry = """
export MISE_GLOBAL_CONFIG_FILE=/dev/null
export MISE_SYSTEM_CONFIG_FILE=/dev/null
export MISE_OVERRIDE_TOOL_VERSIONS_FILENAMES=none
export MISE_CEILING_PATHS="$(dirname "$(git rev-parse --show-toplevel)")"
mise trust mise.toml
mise install --locked
""",
    language = "system",
    shell = "sh",
    pass_filenames = false,
    always_run = true,
    fail_fast = true,
    verbose = true,
    priority = 0,
    stages = [
      "pre-commit",
      "commit-msg"
    ]
  },
  {
    id = "prettier",
    name = "prettier",
    entry = "mise exec -- prettier --check",
    language = "system",
    files = '\.(json|md|ya?ml)$'
  },
  {
    id = "markdownlint-cli2",
    name = "markdownlint-cli2",
    entry = "mise exec -- markdownlint-cli2",
    language = "system",
    files = '\.md$'
  },
  {
    id = "claude-plugin-validate",
    name = "claude plugin validate",
    entry = "claude plugin validate .",
    language = "system",
    pass_filenames = false
  },
  {
    id = "codex-manifest-lockstep",
    name = "codex manifest matches plugin.json",
    entry = """
set -e
for codex in */.codex-plugin/plugin.json; do
  [ -e "$codex" ] || continue
  diff -u "${codex%.codex-plugin/plugin.json}.claude-plugin/plugin.json" "$codex"
done
""",
    language = "system",
    shell = "sh",
    pass_filenames = false
  },
  {
    id = "actionlint",
    name = "actionlint",
    entry = "mise exec -- actionlint",
    language = "system",
    files = '^\.github/workflows/[^/]+\.ya?ml$'
  },
  {
    id = "zizmor",
    name = "zizmor",
    entry = "mise exec -- zizmor",
    language = "system",
    files = '^\.github/workflows/[^/]+\.ya?ml$'
  },
  {
    id = "vale",
    name = "vale",
    entry = "mise exec -- vale",
    language = "system",
    files = '\.md$'
  },
  {
    id = "vale-commit-message",
    name = "vale (commit message)",
    entry = "mise exec -- scripts/vale-commit-message.sh",
    language = "system",
    stages = ["commit-msg"]
  }
]
